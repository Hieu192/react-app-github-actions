name: CI/CD

# Trigger by push event on branch main
on:
  push:
    branches:
      - main

# Define all environment variables (Previously defined in secrets and variables)
env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
  DOCKER_HUB_REPOSITORIES: react-app-github-actions
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
  SSH_HOST: ${{ secrets.SSH_HOST }}

# Define all jobs, include two jobs are build-and-push and deploy
jobs:

  # build-and-push job
  build-and-push:

    # Choosing the runner for jobs is ubuntu-22.04
    runs-on: ubuntu-22.04

    steps:
        # Checkout Code to copy source code from Github Reporsitories to runner (ubuntu-22.04) in the GitHub Actions process.
      - name: Checkout code
        uses: actions/checkout@v2

        # Login to Docker Hub
      - name: Login to Docker Hub
        run: docker login -u $DOCKER_HUB_USERNAME -p $DOCKER_HUB_PASSWORD

        # Build and Push Image to Docker Hub
      - name: Build and Push Image to Docker Hub
        run: |
          docker build -t $DOCKER_HUB_USERNAME/$DOCKER_HUB_REPOSITORIES:latest .  
          docker push $DOCKER_HUB_USERNAME/$DOCKER_HUB_REPOSITORIES:latest

  # deploy job
  deploy:

    # deploy only run when build-and-push completed
    needs: build-and-push
    # Choosing the runner for jobs is ubuntu-22.04
    runs-on: ubuntu-22.04

    steps:
      - name: Deploy to server
        run: |

          # Paste SSH_PRIVATE_KEY to sshkey.pem
          echo "$SSH_PRIVATE_KEY" > sshkey.pem
          # Change mode read for sshkey.pem
          chmod 400 sshkey.pem

          # Pull image latest
          ssh -o StrictHostKeyChecking=no -i sshkey.pem $SSH_USERNAME@$SSH_HOST "docker pull $DOCKER_HUB_USERNAME/$DOCKER_HUB_REPOSITORIES:latest"
          # Remove container react-app if existed
          ssh -o StrictHostKeyChecking=no -i sshkey.pem $SSH_USERNAME@$SSH_HOST "docker rm -f react-app"
          # Run new container react-app on port 3000
          ssh -o StrictHostKeyChecking=no -i sshkey.pem $SSH_USERNAME@$SSH_HOST "docker run -d -p 3000:3000 --name react-app $DOCKER_HUB_USERNAME/$DOCKER_HUB_REPOSITORIES:latest"
